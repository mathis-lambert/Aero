name: Distribute
on:
  push:
    tags: ['v*', 'nightly-*']
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (leave empty for a nightly from main)'
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: aero-distribution
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.select.outputs.tag }}
      revision: ${{ steps.select.outputs.revision }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
      - id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          REQUESTED_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          if [[ "$EVENT_NAME" == push ]]; then tag="$PUSH_TAG"; fi
          if [[ -z "$tag" ]]; then
            latest=$(git tag --list 'nightly-*' --sort=-refname | sed -n '1p')
            if [[ -n "$latest" ]] && [[ "$(git rev-parse "$latest^{commit}")" == "$(git rev-parse HEAD)" ]]; then
              if draft=$(gh release view "$latest" --json isDraft --jq '.isDraft' 2>/dev/null); then
                [[ "$draft" == false ]] || { echo 'An incomplete draft exists; inspect it before retrying.'; exit 1; }
                echo 'No changes since the last nightly.'
                exit 0
              fi
              tag="$latest"
            else
              tag="nightly-$(date -u +%Y-%m-%d)"
            fi
            if git show-ref --verify --quiet "refs/tags/$tag"; then
              [[ "$(git rev-parse "$tag^{commit}")" == "$(git rev-parse HEAD)" ]] || { echo 'Nightly tag already identifies another commit.'; exit 1; }
            else
              git tag "$tag"
              git push origin "refs/tags/$tag"
            fi
          fi
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-beta\.([1-9][0-9]*))?$ || "$tag" =~ ^nightly-[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo 'Invalid tag.'; exit 1; }
          revision=$(git rev-parse --verify "refs/tags/$tag^{commit}")
          git merge-base --is-ancestor "$revision" origin/main
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace its artifacts.'
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
  distribute:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    runs-on: xcode-27
    timeout-minutes: 100
    environment: distribution
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.0.app/Contents/Developer
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          fetch-depth: 0
      - run: |
          Scripts/check-toolchain.sh
          xcodebuild -downloadComponent MetalToolchain
      - name: Set credential paths
        run: |
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/aero-notary.p8" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$RUNNER_TEMP/aero-signing.keychain-db" >> "$GITHUB_ENV"
      - name: Import signing credentials
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/aero-signing.p12"
          printf '%s' "$API_PRIVATE_KEY" > "$APPLE_API_KEY_PATH"
          security create-keychain -p "$keychain_password" "$SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$SIGNING_KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$SIGNING_KEYCHAIN"
          security import "$RUNNER_TEMP/aero-signing.p12" -P "$CERTIFICATE_PASSWORD" -t cert -f pkcs12 -k "$SIGNING_KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$keychain_password" "$SIGNING_KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$SIGNING_KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          rm "$RUNNER_TEMP/aero-signing.p12"
      - id: package
        run: Scripts/distribute.sh "$RELEASE_TAG"
      - name: Publish completed artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          OUTPUT: ${{ steps.package.outputs.output }}
          CHANNEL: ${{ steps.package.outputs.channel }}
          REVISION: ${{ needs.prepare.outputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          flags=(--latest=false --prerelease)
          if [[ "$CHANNEL" == stable ]]; then flags=(--latest); fi
          gh release create "$RELEASE_TAG" "$OUTPUT"/public/* --verify-tag --target "$REVISION" \
            --title "Aero $RELEASE_TAG" --generate-notes --draft "${flags[@]}"
          gh release edit "$RELEASE_TAG" --draft=false "${flags[@]}"
      - name: Retain archive, symbols and diagnostics
        if: always()
        run: |
          if [ -d build/artifacts ]; then
            tar -czf "$RUNNER_TEMP/aero-distribution.tar.gz" -C build artifacts
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: distribution-${{ needs.prepare.outputs.tag }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aero-distribution.tar.gz
          retention-days: 14
          if-no-files-found: ignore
      - name: Remove signing credentials
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/aero-signing.keychain-db" ]]; then security delete-keychain "$RUNNER_TEMP/aero-signing.keychain-db"; fi
          rm -f "$RUNNER_TEMP/aero-signing.p12" "$RUNNER_TEMP/aero-notary.p8"
