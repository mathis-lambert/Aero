name: Distribute
on:
  push:
    branches: [main]
    tags: ['v*', 'nightly-*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (leave empty for a nightly from main)'
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: aero-distribution-${{ github.ref }}-${{ inputs.tag || github.sha }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.select.outputs.tag }}
      revision: ${{ steps.select.outputs.revision }}
      published: ${{ steps.select.outputs.published }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 0
      - id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          REQUESTED_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          if [[ "$EVENT_NAME" == push && "$REF_TYPE" == tag ]]; then tag="$PUSH_TAG"; fi
          if [[ -z "$tag" ]]; then
            tag="nightly-$(git rev-parse HEAD)"
            if git show-ref --verify --quiet "refs/tags/$tag"; then
              [[ "$(git rev-parse "$tag^{commit}")" == "$(git rev-parse HEAD)" ]] || { echo 'Nightly tag identifies another commit.'; exit 1; }
            else
              git tag "$tag"
              git push origin "refs/tags/$tag"
            fi
          fi
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-beta\.([1-9][0-9]*))?$ || "$tag" =~ ^nightly-[0-9a-f]{40}$ ]] || { echo 'Invalid tag.'; exit 1; }
          revision=$(git rev-parse --verify "refs/tags/$tag^{commit}")
          git merge-base --is-ancestor "$revision" origin/main
          if [[ "$tag" == nightly-* ]]; then
            [[ "${tag#nightly-}" == "$revision" ]] || { echo 'Nightly tag must identify its commit.'; exit 1; }
          fi
          if draft=$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null); then
            [[ "$draft" == false ]] || { echo 'An incomplete draft exists; inspect it before retrying.'; exit 1; }
            echo 'Release already published; retry only feed publication.'
            echo 'published=true' >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
  distribute:
    needs: prepare
    if: needs.prepare.outputs.tag != '' && needs.prepare.outputs.published != 'true'
    runs-on: xcode-27
    timeout-minutes: 100
    environment: distribution
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.0.app/Contents/Developer
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          fetch-depth: 0
      - run: |
          Scripts/check-toolchain.sh
          xcodebuild -downloadComponent MetalToolchain
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Set credential paths
        run: |
          echo "SPARKLE_PRIVATE_KEY_FILE=$RUNNER_TEMP/aero-sparkle-key" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/aero-notary.p8" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$RUNNER_TEMP/aero-signing.keychain-db" >> "$GITHUB_ENV"
      - name: Import signing credentials
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SPARKLE_PUBLIC_ED_KEY" && test -n "$SPARKLE_PRIVATE_KEY"
          umask 077
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$SPARKLE_PRIVATE_KEY_FILE"
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/aero-signing.p12"
          printf '%s' "$API_PRIVATE_KEY" > "$APPLE_API_KEY_PATH"
          security create-keychain -p "$keychain_password" "$SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$SIGNING_KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$SIGNING_KEYCHAIN"
          security import "$RUNNER_TEMP/aero-signing.p12" -P "$CERTIFICATE_PASSWORD" -t cert -f pkcs12 -k "$SIGNING_KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$keychain_password" "$SIGNING_KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$SIGNING_KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          rm "$RUNNER_TEMP/aero-signing.p12"
      # Only Stable.xcconfig names this profile; without it, a stable archive fails in Xcode.
      - name: Install passkey provisioning profile
        env:
          PASSKEY_PROFILE: ${{ secrets.APPLE_PASSKEY_PROFILE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PASSKEY_PROFILE" || exit 0
          umask 077
          printf '%s' "$PASSKEY_PROFILE" | base64 --decode > "$RUNNER_TEMP/aero-passkeys.provisionprofile"
          uuid=$(security cms -D -i "$RUNNER_TEMP/aero-passkeys.provisionprofile" | plutil -extract UUID raw -)
          profiles="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$profiles"
          echo "PASSKEY_PROFILE_FILE=$profiles/$uuid.provisionprofile" >> "$GITHUB_ENV"
          mv "$RUNNER_TEMP/aero-passkeys.provisionprofile" "$profiles/$uuid.provisionprofile"
      # Stable and beta notes are the annotated tag's message, reviewed with the tag; nightlies list their changes.
      - name: Select release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/aero-release-notes.md"
          if [[ "$RELEASE_TAG" == nightly-* ]]; then
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$RELEASE_TAG" --jq .body > "$notes"
          else
            object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.type + " " + .object.sha')
            [[ "$object" == "tag "* ]] || { echo 'Stable and beta tags must be annotated with their release notes.'; exit 1; }
            gh api "repos/$GITHUB_REPOSITORY/git/tags/${object#tag }" --jq .message > "$notes"
            grep -q '[^[:space:]]' "$notes" || { echo 'The tag message holds no release notes.'; exit 1; }
          fi
          echo "RELEASE_NOTES_FILE=$notes" >> "$GITHUB_ENV"
      - id: package
        run: Scripts/distribute.sh "$RELEASE_TAG"
      - name: Publish completed artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          OUTPUT: ${{ steps.package.outputs.output }}
          CHANNEL: ${{ steps.package.outputs.channel }}
          REVISION: ${{ needs.prepare.outputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          flags=(--latest=false --prerelease)
          if [[ "$CHANNEL" == stable ]]; then flags=(--latest); fi
          gh release create "$RELEASE_TAG" "$OUTPUT"/public/* --verify-tag --target "$REVISION" \
            --title "Aero $RELEASE_TAG" --notes-file "$OUTPUT/release-notes.md" --draft "${flags[@]}"
          gh release edit "$RELEASE_TAG" --draft=false "${flags[@]}"
      - name: Retain archive, symbols and diagnostics
        if: always()
        run: |
          if [ -d build/artifacts ]; then
            tar -czf "$RUNNER_TEMP/aero-distribution.tar.gz" -C build artifacts
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: distribution-${{ needs.prepare.outputs.tag }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aero-distribution.tar.gz
          retention-days: 14
          if-no-files-found: ignore
      - name: Remove signing credentials
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/aero-signing.keychain-db" ]]; then security delete-keychain "$RUNNER_TEMP/aero-signing.keychain-db"; fi
          rm -f "$RUNNER_TEMP/aero-signing.p12" "$RUNNER_TEMP/aero-notary.p8" "$RUNNER_TEMP/aero-sparkle-key" "$RUNNER_TEMP/aero-passkeys.provisionprofile"
          if [[ -n "${PASSKEY_PROFILE_FILE:-}" ]]; then rm -f "$PASSKEY_PROFILE_FILE"; fi

  publish-feed:
    needs: [prepare, distribute]
    if: always() && needs.prepare.result == 'success' && (needs.distribute.result == 'success' || needs.prepare.outputs.published == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: distribution
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Publish signed appcast
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          UPDATE_HOST: ${{ secrets.UPDATE_HOST }}
          UPDATE_USER: ${{ secrets.UPDATE_USER }}
          UPDATE_PORT: ${{ secrets.UPDATE_PORT }}
          UPDATE_SSH_KEY: ${{ secrets.UPDATE_SSH_KEY }}
          UPDATE_KNOWN_HOSTS: ${{ secrets.UPDATE_KNOWN_HOSTS }}
        run: Scripts/publish-update.sh "$RELEASE_TAG"
