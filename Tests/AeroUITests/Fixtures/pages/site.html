<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Site fixture</title></head>
<body>
<p id="cookie"></p>
<button onclick="document.cookie = 'aero=1; max-age=3600'; showCookie()">Set cookie</button>
<script>
const showCookie = () => document.getElementById("cookie").textContent = document.cookie.includes("aero=1") ? "Cookie set" : "No cookie";
showCookie();
</script>
</body>
</html>
